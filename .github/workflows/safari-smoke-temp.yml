# Branch-only fallback to distinguish CI browser-download stalls from product failures.
name: Safari final focused Chrome smoke
on:
  push:
    branches: [fix/safari-final-audit-guard]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Use preinstalled runner Chrome without Playwright browser downloads
        run: |
          set -eu
          if ! command -v chromium >/dev/null 2>&1; then
            CHROME="$(command -v google-chrome || true)"
            if [ -z "$CHROME" ]; then echo "No local Chrome available"; exit 2; fi
            sudo ln -sf "$CHROME" /usr/bin/chromium
          fi
          chromium --version
      - name: Test RIFT and SPA auth safety on Chrome
        run: |
          python tests/test_safari_spa_guard.py
          python tests/test_rift_hidden_auth.py
          python tests/test_safari_bootstrap.py
