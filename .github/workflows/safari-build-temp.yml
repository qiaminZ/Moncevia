name: Safari temporary artifact compiler
on:
  push:
    branches: [fix/safari-userscripts-update-startup]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Format updated build tool
        run: npx prettier --write scripts/build.mjs
      - name: Check typed modules and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:core
      - name: Generate Safari metadata and all browser engines
        run: |
          npm run build
          npm run build:check
          python tests/test_architecture.py
          python scripts/audit_release.py
      - name: Commit reproducibly compiled artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.mjs moncevia.meta.js moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: compile v3.15.1 Safari update metadata and userscript engines"
          git push origin HEAD:refs/heads/fix/safari-userscripts-update-startup
