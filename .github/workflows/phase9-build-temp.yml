# Branch-only build aid. Deleted before pull-request integration.
name: Phase 9 temporary bundle compiler
on:
  push:
    branches:
      - refactor/phase9-typed-gm-bridge

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Format typed module and tests
        run: npx prettier --write src/platform/gm-bridge.ts tests/core/gm-bridge.test.ts
      - name: Validate typed module and core
        run: |
          npm run typecheck
          npm run lint
          npm run test:core
      - name: Build three browser engines
        run: |
          npm run build
          python tests/test_architecture.py
      - name: Commit generated browser engines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/gm-bridge.ts tests/core/gm-bridge.test.ts moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if git diff --cached --quiet; then
            echo "Generated bundles already up to date"
            exit 0
          fi
          git commit -m "build: regenerate Moncevia v3.12.0 GM-compatible engines"
          git push origin HEAD:refs/heads/refactor/phase9-typed-gm-bridge
