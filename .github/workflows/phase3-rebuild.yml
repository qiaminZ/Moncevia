name: Phase 3 rebuild after viewport fix
on:
  push:
    branches: [refactor/phase3-ui-detector-responsive-v3.7.0]
    paths: ['.github/phase3-rebuild.trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check and generate artifacts
        run: |
          npm run typecheck
          npm run lint
          npm run test:core
          npm run build
          npm run build:check
          node --check moncevia.user.js
          python scripts/build_native.py
          python tests/test_architecture.py
      - name: Commit browser artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: update responsive panel CSS in browser artifacts'
            git push origin HEAD:refactor/phase3-ui-detector-responsive-v3.7.0
          fi
