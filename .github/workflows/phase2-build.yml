name: Phase 2 — generate browser artifacts
on:
  push:
    branches:
      - refactor/phase2-typed-financial-core
    paths:
      - '.github/phase2-build.trigger'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned toolchain
        run: npm ci --no-audit --no-fund
      - name: Format migrated TypeScript modules
        run: npx prettier --write 'src/core/*.ts' 'src/types/*.ts' 'src/entry/*.ts'
      - name: Typecheck, lint and focused financial tests
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:core
      - name: Build userscript and both extension engines
        run: |
          npm run build
          npm run build:check
          node --check moncevia.user.js
          python scripts/build_native.py
          python tests/test_architecture.py
      - name: Commit generated artifacts back to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core src/types src/entry moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: compile phase 2 typed core for userscript and native extensions'
            git push origin HEAD:refactor/phase2-typed-financial-core
          fi
