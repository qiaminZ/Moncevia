name: Phase 6 — generate typed i18n artifacts
on:
  push:
    branches: [refactor/phase6-i18n-v3.10.0]
    paths: ['.github/phase6-build.trigger']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund
      - name: Format new TypeScript modules and tests
        run: npx prettier --write 'src/i18n/*.ts' 'tests/core/i18n.test.ts'
      - name: Static and financial regression validation
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:core
      - name: Compile and verify native engines
        run: |
          npm run build
          npm run build:check
          node --check moncevia.user.js
          python scripts/build_native.py
          python tests/test_architecture.py
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n tests/core/i18n.test.ts moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate v3.10.0 localized userscript and native engines'
            git push origin HEAD:refactor/phase6-i18n-v3.10.0
          fi
