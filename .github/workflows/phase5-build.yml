name: Phase 5 — one-shot typed core build
on:
  push:
    branches: [refactor/phase5-typed-settings-providers-v3.9.0]
    paths: ['.github/phase5-build.trigger']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format new modules and tests
        run: npx prettier --write src/core/provider-validation.ts src/core/settings-validation.ts tests/core/provider-validation.test.ts tests/core/settings-validation.test.ts
      - name: Validate types, lint, formatting and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:core
      - name: Compile identical userscript and native extension engines
        run: |
          npm run build
          npm run build:check
          node --check moncevia.user.js
          python scripts/build_native.py
          python tests/test_architecture.py
      - name: Commit generated artifacts on the development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/provider-validation.ts src/core/settings-validation.ts tests/core/provider-validation.test.ts tests/core/settings-validation.test.ts moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: compile typed phase 5 validators into browser artifacts'
            git push origin HEAD:refactor/phase5-typed-settings-providers-v3.9.0
          fi
