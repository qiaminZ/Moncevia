# Phase 11 branch-only artifact generation. Removed before merge.
name: Phase 11 temporary build
on:
  push:
    branches: [refactor/phase11-typed-panel-components]
permissions:
  contents: write
jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/ui/dom-factory.ts src/ui/panel-shell.ts
      - run: |
          npm run typecheck
          npm run lint
          npm run test:core
      - run: |
          npm run build
          python tests/test_architecture.py
      - name: Commit generated browser engines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/dom-factory.ts src/ui/panel-shell.ts moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: generate Moncevia v3.14.0 typed panel bundles"
          git push origin HEAD:refs/heads/refactor/phase11-typed-panel-components
