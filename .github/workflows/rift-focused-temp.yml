# Temporary targeted failure diagnostic; remove before merge.
name: RIFT focused Chromium diagnosis
on:
  push:
    branches: [fix/rift-hidden-signin-bootstrap]
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_rift_hidden_auth.py
