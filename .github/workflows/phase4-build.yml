name: Phase 4 one-shot artifact build
on:
  push:
    branches: [refactor/phase4-variant-detector-events-v3.8.0]
    paths: ['.github/phase4-build.trigger']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund
      - name: Format typed modules
        run: npx prettier --write 'src/detector/*.ts' 'tests/core/variant-detector.test.ts' 'tests/core/selection-scheduler.test.ts'
      - name: Static and unit validation
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:core
      - name: Generate all platform bundles
        run: |
          npm run build
          npm run build:check
          node --check moncevia.user.js
          python scripts/build_native.py
          python tests/test_architecture.py
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/detector tests/core/variant-detector.test.ts tests/core/selection-scheduler.test.ts moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: compile phase 4 variant detector and platform bundles'
            git push origin HEAD:refactor/phase4-variant-detector-events-v3.8.0
          fi
