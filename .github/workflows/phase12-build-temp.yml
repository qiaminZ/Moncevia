# Phase 12 branch-only generator. Removed before PR integration.
name: Phase 12 temporary artifact compilation
on:
  push:
    branches: [refactor/phase12-runtime-lifecycle]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/platform/page-lifecycle.ts
      - run: |
          npm run typecheck
          npm run lint
          npm run test:core
      - run: |
          npm run build
          python tests/test_architecture.py
      - name: Commit three browser bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/page-lifecycle.ts moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: generate Moncevia 3.15.0 lifecycle engines"
          git push origin HEAD:refs/heads/refactor/phase12-runtime-lifecycle
