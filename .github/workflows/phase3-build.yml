name: Phase 3 one-shot browser artifacts
on:
  push:
    branches:
      - refactor/phase3-ui-detector-responsive-v3.7.0
    paths:
      - '.github/phase3-build.trigger'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund
      - name: Format new TypeScript modules
        run: npx prettier --write 'src/detector/*.ts' 'src/ui/*.ts'
      - name: Verify typecheck, lint, formatting and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:core
      - name: Generate the three identical installable engines
        run: |
          npm run build
          npm run build:check
          node --check moncevia.user.js
          python scripts/build_native.py
          python tests/test_architecture.py
      - name: Commit generated browser artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/detector src/ui moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate responsive phase 3 browser engines'
            git push origin HEAD:refactor/phase3-ui-detector-responsive-v3.7.0
          fi
