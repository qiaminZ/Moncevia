# Temporary branch-only bundle compilation; removed before merge.
name: Safari audit rebuild
on:
  push:
    branches: [fix/safari-final-audit-guard]
permissions:
  contents: write
jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/platform/page-lifecycle.ts
      - run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:core
      - run: |
          npm run build
          npm run build:check
          python tests/test_architecture.py
          python scripts/audit_release.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/page-lifecycle.ts moncevia.user.js moncevia.meta.js extension/chromium/engine.js extension/firefox/engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: regenerate Moncevia 3.15.3 audited Safari engines"
          git push origin HEAD:refs/heads/fix/safari-final-audit-guard
