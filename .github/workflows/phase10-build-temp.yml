# Branch-only generator for reproducible bundles; remove after successful artifact build.
name: Phase 10 temporary artifact compilation
on:
  push:
    branches:
      - refactor/phase10-persistence-lifecycle

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Format extracted typed code
        run: npx prettier --write src/platform/persistence-controller.ts tests/core/persistence-controller.test.ts
      - name: Validate typed sources and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run test:core
      - name: Build and check generated browser engines
        run: |
          npm run build
          python tests/test_architecture.py
      - name: Commit generated browser engines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/persistence-controller.ts tests/core/persistence-controller.test.ts moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if git diff --cached --quiet; then
            echo "All browser bundles already current"
            exit 0
          fi
          git commit -m "build: generate Moncevia v3.13.0 durable-persistence engines"
          git push origin HEAD:refs/heads/refactor/phase10-persistence-lifecycle
