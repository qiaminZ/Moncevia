# Branch-only build aid; must be deleted before the final PR merge.
name: Phase 10 temporary artifact compilation
on:
  push:
    branches:
      - refactor/phase10-persistence-lifecycle

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned tooling
        run: npm ci --no-audit --no-fund
      - name: Check typed code and units
        run: |
          npm run typecheck
          npm run lint
          npm run test:core
      - name: Regenerate and check three browser engines
        run: |
          npm run build
          python tests/test_architecture.py
      - name: Commit bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh v3.13.0 artifacts after history race correction"
          git push origin HEAD:refs/heads/refactor/phase10-persistence-lifecycle
