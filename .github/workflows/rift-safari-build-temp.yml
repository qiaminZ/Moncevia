# Temporary branch-only compiler; removed after verifying artifacts.
name: RIFT Safari temporary build
on:
  push:
    branches: [fix/rift-hidden-signin-bootstrap]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: TypeScript, lint, formatting and core
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:core
      - name: Generate Safari metadata, userscript and native engines
        run: |
          npm run build
          npm run build:check
          python tests/test_architecture.py
          python scripts/audit_release.py
      - name: Commit generated browser engines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moncevia.meta.js moncevia.user.js extension/chromium/engine.js extension/firefox/engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: Moncevia 3.15.2 RIFT hidden-login Safari patch"
          git push origin HEAD:refs/heads/fix/rift-hidden-signin-bootstrap
